name: Build Windows App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Kodlarni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js muhitini sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kerakli kutubxonalarni o'rnatish
        run: npm install

      - name: Exe dasturini yig'ish (Build)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tayyor EXE faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: KompNazorat-Windows-App
          path: dist/*.exe
